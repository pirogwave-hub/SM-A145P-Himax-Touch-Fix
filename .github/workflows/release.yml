name: Build KernelSU Module Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pack module zip
        run: |
          zip -r SM-A145P-Himax-Touch-Fix-${{ github.ref_name }}.zip module.prop service.sh META-INF

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: SM-A145P-Himax-Touch-Fix-${{ github.ref_name }}.zip
